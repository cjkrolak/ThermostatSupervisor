---
name: Azure Pipelines
# disable CI trigger
trigger: none
# disable automatic PR triggers - pipeline is now triggered by GitHub workflow
# NOTE: This pipeline is triggered by .github/workflows/trigger-ado-tests.yml
# which checks the USE_ADO_UNIT_TESTS repository variable before starting
# this pipeline. This prevents the pipeline from starting and failing due to
# ADO account limits before the environment variable can be checked.
pr: none
stages:
  # Stage 1: Python unit tests, linting, and code coverage publishing
  - stage: PythonUnitTests
    displayName: Python Unit Tests
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: RunUnitTests
        displayName: Run Python Unit Tests
        strategy:
          matrix:
            # only run 1 version of python to save CI time
            # Python312:
            #  python.version: '3.12'
            Python313:
              python.version: '3.13'
        steps:
          # This pipeline is triggered by GitHub workflow trigger-ado-tests.yml
          - script: |
              echo "Azure Pipeline triggered by GitHub Actions workflow"
              echo "The USE_ADO_UNIT_TESTS variable was checked before starting"
              echo "this pipeline to prevent account limit failures"
            displayName: Report ADO Pipeline Trigger Status
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(python.version)
              # githubToken: $(THERMOSTATSUPERVISOR_PR)
            # github token appears to enforce only supported python versions,
            # ref  # 884. v3.13 is not supported by ubuntu-latest; once it is,
            # the github token can be enabled.
            displayName: Set Up Python $(python.version)
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r requirements_dev.txt
              pip list
            displayName: Install Python Dependencies
          # line length and extend-ignore options added for black compatibility
          - script: |
              python -m pip install flake8 --upgrade
              flake8 --config=setup.cfg .
              echo "##vso[task.setvariable variable=lintPassed]true"
              echo "##vso[task.setvariable variable=lintPassed;isOutput=true]true"
            displayName: Run Flake8 Lint Checks
            name: runLint
          # python unit tests
          - script: |
              # python -m unittest discover -v
              # discover process is not allowing argv override so calling
              # unit_test_common instead.
              python -m tests.unit_test_coverage
              exit_code=$?
              # Set output variable for test result
              echo "##vso[task.setvariable variable=testExitCode;"\
              "isOutput=true]${exit_code}"
              if [ ${exit_code} -ne 0 ]; then
                echo "Tests failed with exit code ${exit_code}"
                exit ${exit_code}
              else
                echo "Tests passed"
              fi
            displayName: Run Python Unit Tests
            name: runTests
            # timeout after 45 minutes, nominal job time is 10 minutes
            timeoutInMinutes: '45'
            env:
              GMAIL_USERNAME: $(GMAIL_USERNAME)  # used for some unit tests
              GMAIL_PASSWORD: $(GMAIL_PASSWORD)  # used for some unit tests
              TCC_USERNAME: $(TCC_USERNAME)  # used for Honeywell int test
              TCC_PASSWORD: $(TCC_PASSWORD)  # used for Honeywell int test
              SHT31_REMOTE_IP_ADDRESS_1: $(SHT31_REMOTE_IP_ADDRESS_1)
              # SHT31_REMOTE_IP_ADDRESS_99: '$(SHT31_REMOTE_IP_ADDRESS_99)'
              KUMO_USERNAME: $(KUMO_USERNAME)  # used for kumocloud int test
              KUMO_PASSWORD: $(KUMO_PASSWORD)  # used for kumocloud int test
              BLINK_USERNAME: $(BLINK_USERNAME)  # used for blink int test
              BLINK_PASSWORD: $(BLINK_PASSWORD)  # used for blink int test
              BLINK_2FA: $(BLINK_2FA)  # used for blink int test
          # publish code coverage results to ADO pipeline
          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: coverage.xml
            displayName: Publish Code Coverage Results to ADO
            condition: >-
              and(succeededOrFailed(), eq(variables['lintPassed'], 'true'))
          # publish coverage.xml as pipeline artifact for Stage 2
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: coverage.xml
              artifact: coverage-xml
            displayName: Publish Coverage XML Artifact for Stage 2
            condition: >-
              and(succeededOrFailed(), eq(variables['lintPassed'], 'true'))

  # Stage 2: Upload coverage artifact and trigger SonarQube analysis
  - stage: SonarQube
    displayName: SonarQube Analysis
    dependsOn: PythonUnitTests
    condition: succeededOrFailed()
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: TriggerSonarQube
        displayName: Upload Coverage and Trigger SonarQube
        variables:
          testExitCode: >-
            $[ stageDependencies.PythonUnitTests.RunUnitTests.outputs
            ['Python313.runTests.testExitCode'] ]
          lintPassed: >-
            $[ stageDependencies.PythonUnitTests.RunUnitTests.outputs
            ['Python313.runLint.lintPassed'] ]
        steps:
          # Download coverage.xml artifact published by Stage 1
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: coverage-xml
              targetPath: $(System.DefaultWorkingDirectory)
            displayName: Download Coverage XML Artifact from Stage 1
          # Upload coverage.xml as GitHub gist artifact for SonarQube workflow
          - script: |
              set -e
              echo "Uploading coverage.xml as GitHub artifact..."

              # Validate token and file exist
              if [ -z "${THERMOSTATSUPERVISOR_PR}" ]; then
                echo "ERROR: THERMOSTATSUPERVISOR_PR is not set"
                exit 1
              fi
              if [ ! -f "coverage.xml" ]; then
                echo "ERROR: coverage.xml not found"
                exit 1
              fi
              echo "Coverage file size: $(wc -c < coverage.xml) bytes"

              # Create JSON payload using a temp file to avoid length limits
              temp_json=$(mktemp)
              cat > "${temp_json}" << 'EOF'
              {
                "description": "SonarQube coverage - Build BUILD_ID_PLACEHOLDER",
                "public": false,
                "files": {
                  "coverage.xml": {
                    "content": "CONTENT_PLACEHOLDER"
                  }
                }
              }
              EOF

              # Replace BUILD_ID_PLACEHOLDER with actual build ID
              sed -i "s/BUILD_ID_PLACEHOLDER/$(Build.BuildId)/g" "${temp_json}"

              # Replace CONTENT_PLACEHOLDER with properly escaped content.
              # Use Python to escape JSON to avoid shell quoting issues.
              python3 -c "
              import json

              # Read the coverage.xml content
              with open('coverage.xml', 'r') as f:
                  coverage_content = f.read()

              # Read the JSON template
              with open('${temp_json}', 'r') as f:
                  json_template = f.read()

              # Replace placeholder with properly escaped JSON string
              escaped_content = json.dumps(coverage_content)
              final_json = json_template.replace(
                  '\"CONTENT_PLACEHOLDER\"', escaped_content
              )

              # Write the final JSON
              with open('${temp_json}', 'w') as f:
                  f.write(final_json)
              "

              # Create the GitHub gist using the JSON file
              response=$(curl -w "%{http_code}" -s -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token ${THERMOSTATSUPERVISOR_PR}" \
                -H "User-Agent: Azure-DevOps-Pipeline" \
                -H "Content-Type: application/json" \
                https://api.github.com/gists \
                --data-binary "@${temp_json}")

              # Clean up temporary file
              rm -f "${temp_json}"

              # Extract HTTP status code and response body
              http_code="${response: -3}"
              response_body="${response%???}"
              if [[ ${http_code} -ge 200 && ${http_code} -lt 300 ]]; then
                # Extract gist ID from response
                gist_id=$(echo "${response_body}" | \
                  grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                echo "SUCCESS: Coverage uploaded to gist: ${gist_id}"
                echo "##vso[task.setvariable variable=coverageGistId;"\
                "isOutput=true]${gist_id}"
              else
                echo "ERROR: Failed to upload coverage. HTTP ${http_code}"
                echo "Response: ${response_body}"
                exit 1
              fi
            name: uploadCoverage
            displayName: Upload Coverage Data to GitHub Gist
            condition: >-
              and(succeededOrFailed(), eq(variables['lintPassed'], 'true'))
            env:
              THERMOSTATSUPERVISOR_PR: $(THERMOSTATSUPERVISOR_PR)
          # Trigger SonarQube workflow via GitHub repository dispatch event
          - script: |
              set -e  # Exit on any error
              echo "Triggering SonarQube workflow..."

              # Validate token is present
              if [ -z "${THERMOSTATSUPERVISOR_PR}" ]; then
                echo "ERROR: THERMOSTATSUPERVISOR_PR is not set"
                echo ""
                echo "SETUP INSTRUCTIONS:"
                echo "1. Go to Azure DevOps > Pipelines > Library > Variable groups"
                echo "2. Create/edit the variable group used by this pipeline"
                echo "3. Add variable: THERMOSTATSUPERVISOR_PR"
                echo "4. Value: GitHub Personal Access Token (classic) with:"
                echo "   - repo (for private repos) OR public_repo (public)"
                echo "   - workflow (to trigger workflow dispatches)"
                echo "5. Mark the variable as secret in Azure DevOps"
                echo ""
                echo "Create token at: https://github.com/settings/tokens"
                exit 1
              fi
              echo "THERMOSTATSUPERVISOR_PR is configured" \
                "(${#THERMOSTATSUPERVISOR_PR} characters)"

              # Test basic GitHub API access first
              echo "Testing GitHub API access..."
              test_response=$(curl -w "%{http_code}" -s \
                -H "Authorization: token ${THERMOSTATSUPERVISOR_PR}" \
                https://api.github.com/user)
              test_code="${test_response: -3}"
              if [[ ${test_code} -ne 200 ]]; then
                echo "ERROR: GitHub API authentication failed (HTTP ${test_code})"
                echo "The THERMOSTATSUPERVISOR_PR is invalid or expired"
                echo ""
                echo "TOKEN TROUBLESHOOTING:"
                echo "1. Verify the token at: https://github.com/settings/tokens"
                echo "2. Check if the token has expired"
                echo "3. Ensure the token has 'repo' and 'workflow' scopes"
                echo "4. Token must belong to a user with push access to the repo"
                exit 1
              fi
              echo "SUCCESS: GitHub API authentication successful"

              # Get the coverage gist ID set by the uploadCoverage step
              # (passed via env variable to avoid bash command-substitution issues)
              coverage_gist_id="${COVERAGE_GIST_ID}"
              echo "Coverage gist ID: ${coverage_gist_id}"

              # Determine test result status from Stage 1 output variable
              # (passed via env variable from the ADO job-level variable)
              test_exit_code="${TEST_EXIT_CODE}"
              echo "Test exit code: ${test_exit_code}"
              if [[ "${test_exit_code}" == "0" ]]; then
                result_status="success"
              else
                result_status="failure"
              fi
              echo "Test result status: ${result_status}"

              # Create JSON payload for repository dispatch (Azure DevOps source)
              json_payload='{"event_type":"azure-pipeline-completed",'\
              '"client_payload":{"result":"'${result_status}'",'\
              '"run_id":"'$(Build.BuildId)'",'\
              '"coverage_gist_id":"'${coverage_gist_id}'",'\
              '"source":"azure-devops"}}'

              # Make the API request with detailed error handling
              echo "Triggering repository dispatch event..."
              response=$(curl -w "%{http_code}" -s -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token ${THERMOSTATSUPERVISOR_PR}" \
                -H "User-Agent: Azure-DevOps-Pipeline" \
                https://api.github.com/repos/cjkrolak/ThermostatSupervisor/dispatches \
                -d "${json_payload}")

              # Extract HTTP status code (last 3 characters)
              http_code="${response: -3}"
              response_body="${response%???}"
              echo "HTTP Response Code: ${http_code}"
              if [ -n "${response_body}" ]; then
                echo "Response Body: ${response_body}"
              fi

              # Check if the request was successful (2xx status codes)
              if [[ ${http_code} -ge 200 && ${http_code} -lt 300 ]]; then
                echo "SUCCESS: SonarQube workflow triggered successfully"
                exit 0
              elif [[ ${http_code} -eq 401 ]]; then
                echo "ERROR: Authentication failed (HTTP 401)"
                echo ""
                echo "TOKEN PERMISSIONS ISSUE:"
                echo "THERMOSTATSUPERVISOR_PR lacks required permissions"
                echo ""
                echo "Required token scopes:"
                echo "  - repo (for private repositories)"
                echo "  - workflow (to trigger repository dispatch events)"
                echo ""
                echo "Update token at: https://github.com/settings/tokens"
                echo "Response: ${response_body}"
                exit 1
              elif [[ ${http_code} -eq 403 ]]; then
                echo "ERROR: Forbidden (HTTP 403)"
                echo "Token user lacks push access or token scopes insufficient"
                echo ""
                echo "Required:"
                echo "  - Push access to cjkrolak/ThermostatSupervisor"
                echo "  - Token must have 'repo' and 'workflow' scopes"
                echo "Response: ${response_body}"
                exit 1
              elif [[ ${http_code} -eq 404 ]]; then
                echo "ERROR: Repository not found (HTTP 404)"
                echo "Check repository name or token access to the repository"
                echo "Response: ${response_body}"
                exit 1
              else
                echo "ERROR: Failed to trigger SonarQube workflow. HTTP ${http_code}"
                echo "Response: ${response_body}"
                exit 1
              fi
            displayName: Trigger SonarQube GitHub Workflow
            condition: >-
              and(succeededOrFailed(), eq(variables['lintPassed'], 'true'))
            env:
              THERMOSTATSUPERVISOR_PR: $(THERMOSTATSUPERVISOR_PR)
              # Azure DevOps pipeline variable - must be a Personal Access Token
              # with 'repo' and 'workflow' scopes
              COVERAGE_GIST_ID: $(uploadCoverage.coverageGistId)
              TEST_EXIT_CODE: $(testExitCode)
